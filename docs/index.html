<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UGV02x projects</title>

    <style>
      /* Dark-theme friendly: inherit colors, no sticky */
      .toc { margin: 1rem 0; padding: 0; }
      .toc ul { list-style: none; margin: 0; padding-left: 0; }
      .toc li { margin: 0.125rem 0; }
      .toc a { color: inherit; text-decoration: none; display: block; line-height: 1.25; }
      .toc a:hover { text-decoration: underline; }

      /* Indentation + subtle size by level */
      .toc ul ul { padding-left: 1rem; }
      .toc a.lvl-1 { font-weight: 600; font-size: 1.00em; }
      .toc a.lvl-2 { font-weight: 500; font-size: 0.97em; opacity: .95; }
      .toc a.lvl-3 { font-weight: 500; font-size: 0.94em; opacity: .88; }
      .toc a.lvl-4 { font-weight: 400; font-size: 0.92em; opacity: .80; }
      .toc a.lvl-5 { font-weight: 400; font-size: 0.90em; opacity: .75; }
      .toc a.lvl-6 { font-weight: 400; font-size: 0.88em; opacity: .70; }

      /* If you have a fixed header, make anchors land below it: adjust as needed */
      h1, h2, h3, h4, h5, h6 { scroll-margin-top: 64px; }
    </style>

    <style>
      /* optional, but makes it look terminal-ish and preserves tabs */
      .term {
        white-space: pre;       /* keep spaces/newlines exactly */
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        tab-size: 4;
        padding: .75rem;
        border: 1px solid #444;
        border-radius: 8px;
        overflow: auto;         /* horizontal scroll instead of wrapping */
      }
    </style>

    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #0b0c10;
            color: #e5e7eb;
            font: 14px/1.4 system-ui, sans-serif;
        }

        a {
            color: #93c5fd;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Lightbox modal */
        #svgLightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: none;
            z-index: 9999;
        }

        #svgStage {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* content layer */
        #svgStage svg {
            width: 100%;
            height: 100%;
        }

        #svgToolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 3;
        }

        /* above stage */
        #svgClose {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 3;
        }

        #svgStatus {
            position: absolute;
            left: 12px;
            bottom: 12px;
            z-index: 3;
            color: #cbd5e1;
            background: rgba(0, 0, 0, .5);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        #svgToolbar button, #svgClose {
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
        }

        #svgToolbar button:hover, #svgClose:hover {
            background: #0b1220;
        }
      /* Namespaced so it won't collide with your styles */
      .mp4-mini {
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif;
        color: #e5e7eb;
        background: #0b1220;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 10px;
        width: min(100%, 900px);
      }
      .mp4-mini-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
      }
      .mp4-mini video {
        position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      }
      .mp4-mini-controls {
        display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap;
      }
      .mp4-mini button, .mp4-mini input {
        background: #0f172a; color: #e5e7eb; border: 1px solid #263042; border-radius: 8px;
        padding: 6px 10px; font: inherit; cursor: pointer;
      }
      .mp4-mini button:hover { border-color: #3b82f6; }
      .mp4-mini .mp4-mini-speed input { width: 70px; text-align: right; }
      .mp4-mini .spacer { flex: 1; }
        </style>
        <script src="https://unpkg.com/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>

    <!-- Babylon core + loaders (non-module, safe for most hosting) -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <style>
      /* Namespaced viewer styles; safe to mix with your page CSS */
      .glb-viewer{
        overscroll-behavior: contain;
        position: relative;
        width: min(100%, 900px);           /* tweak as you like */
        aspect-ratio: 16 / 9;
        background: #0b0c10;
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
      }
      .glb-canvas{
        position: absolute; inset: 0;
        touch-action: none;
        width: 100%; height: 100%;
        display: block;
      }
      .glb-status{
        position: absolute; left: 8px; top: 8px;
        font: 12px/1.35 system-ui, sans-serif;
        color: #e5eef5; max-width: 60ch;
        background: rgba(0,0,0,.55);
        padding: 6px 10px; border-radius: 8px;
        white-space: pre-wrap; z-index: 2;
        pointer-events: none;
      }
    </style>

    <!-- Mermaid (global/UMD build, stable v10) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <style>
      .mmd{
        display: inline-block;      /* shrink-wrap */
        vertical-align: top;
        margin: 8px;
        background: #0b1220;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px;
        visibility: hidden;         /* hide DSL until we size the SVG */
        overflow: visible;
        max-width: 100%;            /* stay responsive in narrow columns */
      }
      .mmd svg{
        display: block;             /* no inline gaps */
        /* we'll set explicit pixel width/height via JS */
      }
      .mmd-row{ display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; }
      .mmd-row .mmd{ margin:0; }
    </style>

    <style>
      .mmd-figure{
        display:inline-block;       /* shrink-wrap each diagram+caption */
        vertical-align: top;
        margin:8px;
        text-align:center;
      }
      .mmd-figure .mmd{             /* your diagram block */
        display:block;
        margin:0;                   /* figure controls spacing now */
      }
      .mmd-caption{
        margin-top:6px;
        font:12px/1.35 system-ui, sans-serif;
        color:#a8b3c7;
      }
      /* if you use the flex row helper */
      .mmd-row{ display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; }
      .mmd-row .mmd-figure{ margin:0; }
    </style>

    <!-- Graphviz WASM (ES module); creates window.__graphvizPromise -->
    <script type="module">
      import { Graphviz } from "https://cdn.jsdelivr.net/npm/@hpcc-js/wasm@2/dist/index.min.js";
      window.__graphvizPromise = Graphviz.load();
    </script>

    <style>
      /* Tight, stackable graph blocks */
      .dot-figure{ display:inline-block; vertical-align:top; margin:8px; text-align:center; }
      .dot{ display:block; background:#0b1220; border:1px solid #334155; border-radius:10px; padding:10px; }
      /* Shrink-wrap to SVG’s own size, but allow shrinking in narrow columns */
      .dot svg{ display:block; width:auto; height:auto; max-width:100%; }
      .dot-caption{ margin-top:6px; font:12px/1.35 system-ui,sans-serif; color:#a8b3c7; }
      /* Hide raw DOT text to avoid flash-of-dot (FOD) */
      .dot { visibility: hidden; }
      /* Reveal after we inject the SVG */
      .dot[data-rendered="true"] { visibility: visible; }

    </style>

    <style>
      /* Figure wrapper */
      .tbl-figure{ display:inline-block; vertical-align:top; margin:12px; text-align:center; }

      /* Scrollable frame (so wide tables don’t blow the layout) */
      .tbl-wrap{
        max-width:min(100%, 900px);
        background:#0b1220;
        border:1px solid #334155;
        border-radius:10px;
        overflow:auto;            /* horizontal scroll if needed */
      }

      /* Table core */
      /* Table core */
      .tbl{
        border-collapse:separate; border-spacing:0; width:100%;
        font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
        color:#e5e7eb;
      }
      .tbl caption{ caption-side:top; padding:8px 12px; font-weight:600; color:#cbd5e1; }
      .tbl th, .tbl td{ padding:8px 12px; border-bottom:1px solid #1f2937; vertical-align:top; }
      .tbl thead th{
        position:sticky; top:0; z-index:1;
        background:#0f172a; color:#e2e8f0; border-bottom:1px solid #334155;
        text-align:left; font-weight:600;
      }
      .tbl tbody tr:nth-child(odd){ background:#0c1220; }
      .tbl tbody tr:hover{ background:#0d1626; }

      /* Rounded corners on the container + top row */
      .tbl thead th:first-child{ border-top-left-radius:10px; }
      .tbl thead th:last-child{ border-top-right-radius:10px; }
      .tbl tr:last-child td:first-child{ border-bottom-left-radius:10px; }
      .tbl tr:last-child td:last-child{ border-bottom-right-radius:10px; }

      /* Utilities */
      .tbl .num{ text-align:right; font-variant-numeric:tabular-nums; }
      .tbl .mono{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .tbl-compact .tbl th, .tbl-compact .tbl td{ padding:6px 10px; }

      /* Figure caption */
      .tbl-caption{ margin-top:6px; font:12px/1.35 system-ui, sans-serif; color:#a8b3c7; }

      /* Accessibility helper to hide a table caption but keep it for screen readers */
      .visually-hidden{
        position:absolute !important; height:1px; width:1px; overflow:hidden;
        clip:rect(1px,1px,1px,1px); white-space:nowrap; border:0; padding:0; margin:-1px;
      }
      /* Opt-in vertical column borders */
      .tbl.tbl-cols th,
      .tbl.tbl-cols td {
        border-right: 1px solid #1f2937; /* same tone as your row dividers */
      }
      .tbl.tbl-cols th:last-child,
      .tbl.tbl-cols td:last-child {
        border-right: none;              /* no border on the far right edge */
      }

      /* Optional: only body gets column borders (header stays clean) */
      .tbl.tbl-cols-body tbody td { border-right: 1px solid #1f2937; }
      .tbl.tbl-cols-body tbody td:last-child { border-right: none; }

    </style>

    <style>
        .fig-center { text-align: center; }              /* centers inline-block children */
        .fig-center > .figure,
        .fig-center > .dot-figure,
        .fig-center > .mmd-figure,
        .fig-center > .tbl-figure {
            display: inline-block; /* shrink-wrap */
            text-align: left; /* keep captions left if you want */
        }
    </style>
</head>
